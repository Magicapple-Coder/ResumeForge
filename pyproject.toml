[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".tmp_*_venv",
    "backend/.venv",
    "backend/data",
    "frontend",
]

[tool.ruff.lint]
# Start with correctness-oriented rules that match the existing codebase. More
# opinionated rules can be enabled incrementally without creating a noisy rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Current suite is about 87%; keep a conservative floor so normal refactors have room
# while a large untested regression still fails CI.
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 测试走 pytest-xdist 并行（-n auto），正常 ~5 分钟；30 分钟是给慢速
    # 共享 runner 与 coverage 收尾留的宽裕上限，而不是常规耗时。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install a CJK font for PDF export tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Ruff
        run: python -m ruff check .

      - name: Test Windows launcher and release packaging
        if: runner.os == 'Windows'
        working-directory: .
        shell: powershell
        run: |
          .\scripts\tests\Test-Start-ResumeForge.ps1
          .\scripts\tests\Test-Build-Release.ps1

      - name: Run tests with coverage
        run: >-
          python -m pytest -n auto
          --cov=app
          --cov-config=../pyproject.toml
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  macos-launcher-guards:
    name: macOS launcher guards
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run the macOS launcher guard tests
        # 这一份在真 Mac 上跑，用的就是 macOS 自带的 /bin/bash 3.2——
        # 维护者没有 Mac，这是唯一能自动化验证 macOS 启动链的地方。
        # 覆盖：换行/编码（CRLF 会让 shebang 变成 "bad interpreter"）、
        # 可执行位、自举常量（版本号与 SHA-256）、版本窗口与进程记录等纯逻辑。
        run: bash scripts/tests/test-macos-launcher.sh

  macos-runtimes:
    name: macOS portable runtimes
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download and verify the pinned portable runtimes
        # 真正下载一遍便携版 Python 与 Node，用仓库里钉死的 SHA-256 校验。
        # 这一步专抓"摘要抄错一位"这类错误：那种错误在别处一律表现为
        # "用户下载后启动失败"，而且每个人的网络环境都不一样，只有跑一次才知道。
        run: |
          set -euo pipefail
          export RF_RUNTIME_DIR="$PWD/runtime"
          mkdir -p "$RF_RUNTIME_DIR"
          . scripts/macos/lib/common.sh
          . scripts/macos/lib/python.sh
          . scripts/macos/lib/node.sh
          arch="$(detect_macos_arch)"
          echo "架构：$arch"
          rf_install_portable_python "$arch"
          "$RF_PYTHON" -V
          "$RF_PYTHON" -c "import sqlite3, ssl, ctypes, zlib; print('标准库自检通过')"
          rf_install_portable_node "$arch"
          "$RF_NODE_PATH" --version
          "$RF_NPM_PATH" --version
      - name: Verify the pinned digests for the other architecture too
        # runner 是 arm64，所以只有 arm64 那两包会被真正安装与运行；另一份
        # 架构的包只能下载 + 校验摘要，但**正是这一条最有价值**：两个架构的
        # 摘要都是人工抄进仓库的常量，抄错一位在别处一律表现成"用户下载后
        # 启动失败"，而 Intel Mac 用户不会出现在我们的测试矩阵里。
        run: |
          set -euo pipefail
          export RF_RUNTIME_DIR="$PWD/runtime"
          . scripts/macos/lib/common.sh
          . scripts/macos/lib/python.sh
          . scripts/macos/lib/node.sh
          scratch="$(mktemp -d)"
          for foreign_arch in arm64 x64; do
            if [ "$foreign_arch" = "$(detect_macos_arch)" ]; then
              continue
            fi
            echo "校验 $foreign_arch 的便携版 Python..."
            # shellcheck disable=SC2086
            download_verified "$scratch/python-$foreign_arch.tar.gz" \
              "$(rf_python_bootstrap_sha256 "$foreign_arch")" \
              "便携版 Python（${foreign_arch}）" "$RF_PYTHON_BOOTSTRAP_APPROX_MB" \
              $(rf_build_python_bootstrap_urls "$foreign_arch")
            echo "校验 $foreign_arch 的便携版 Node.js..."
            # shellcheck disable=SC2086
            download_verified "$scratch/node-$foreign_arch.tar.gz" \
              "$(rf_node_bootstrap_sha256 "$foreign_arch")" \
              "便携版 Node.js（${foreign_arch}）" "$RF_NODE_BOOTSTRAP_APPROX_MB" \
              $(rf_build_node_bootstrap_urls "$foreign_arch")
          done
          rm -rf "$scratch"
          echo "另一架构的摘要校验通过。"
      - name: Reuse the already-installed runtimes instead of re-downloading
        run: |
          set -euo pipefail
          export RF_RUNTIME_DIR="$PWD/runtime"
          . scripts/macos/lib/common.sh
          . scripts/macos/lib/python.sh
          . scripts/macos/lib/node.sh
          arch="$(detect_macos_arch)"
          rf_install_portable_python "$arch"
          rf_install_portable_node "$arch"
          echo "第二次调用直接复用：$RF_PYTHON"

  macos-end-to-end:
    name: macOS end-to-end (clean checkout)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Start the app the way a Mac user does
        # 维护者没有 Mac，这个作业就是"那台 Mac"：从干净检出开始，
        # 走 start.sh 的完整链路（准备运行时 → 建 venv → 装依赖 →
        # 启动 uvicorn 与 vite → 等健康检查），再用 stop.sh 收尾。
        # 它比文档更可靠：文档只能描述，这里会真的跑。
        run: |
          set -euo pipefail
          # 让 uvicorn 打全日志：这个作业的失败通常是"服务没起来"，而默认的 warning
          # 级别只会在 stderr 里留下一份空白，没有任何可定位的线索。
          export RF_UVICORN_LOG_LEVEL=info
          bash scripts/macos/start.sh --no-browser --backend-port 8123 --frontend-port 5199
          curl -fsS http://127.0.0.1:8123/api/health
          echo
          curl -fsS http://127.0.0.1:5199/api/health
          echo
      - name: Stop the app
        if: always()
        run: bash scripts/macos/stop.sh
      - name: Show the service logs when something failed
        if: failure()
        run: |
          for log in runtime/backend.stderr.log runtime/frontend.stderr.log \
                     runtime/backend.stdout.log runtime/frontend.stdout.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              tail -n 60 "$log"
            fi
          done
          echo "===== 端口与进程 ====="
          # 光有日志还不够："进程还活着但端口没人监听"和"进程早就死了"是两种不同的故障，
          # 前者多半卡在启动流程里，后者要看上面的报错。
          lsof -nP -iTCP:8123 -sTCP:LISTEN || echo "8123 没有监听者"
          lsof -nP -iTCP:5199 -sTCP:LISTEN || echo "5199 没有监听者"
          pgrep -fl "uvicorn|vite" || echo "没有 uvicorn / vite 进程"
          echo "===== 健康探针 ====="
          curl -v --max-time 5 http://127.0.0.1:8123/api/health || echo "8123 健康检查失败"


  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Limit parallel workers so resource-constrained runners do not starve
        # jsdom timers used by the async UI tests.
        run: npm test -- --maxWorkers=2

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement backend/requirements-dev.txt --index-url https://pypi.org/simple

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend production dependencies
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

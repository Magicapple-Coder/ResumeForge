name: 🐛 Bug 反馈
description: 提交你遇到的问题，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，方便我们快速定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期行为是什么？
      placeholder: 请清晰描述问题现象与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步描述如何复现该问题
      placeholder: |
        1. 打开 xx 页面
        2. 点击 xx 按钮
        3. 出现 xx 报错
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、Node 版本、浏览器等
      placeholder: |
        - OS: Windows 11 / macOS / Linux
        - Python: 3.12
        - Node: 20
        - 浏览器: Chrome 120
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 后端终端输出、浏览器控制台报错、截图等
      placeholder: 粘贴相关日志或截图（注意：不要泄露你的 API Key！）

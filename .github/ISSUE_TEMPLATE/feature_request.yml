name: 💡 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你的使用场景
      description: 描述你在什么场景下需要这个功能，它解决什么问题
      placeholder: 例如：我希望在生成简历时能够指定目标薪资范围……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作（可选，没有想法可留空）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他方式可以满足你的需求（可选）
